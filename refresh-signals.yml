name: Refresh live signal data

# Runs server-side on GitHub's infrastructure — full internet access, no CORS
# restriction, and (this is the part that matters for GDELT specifically) a
# different IP range than whatever network was getting rate-limited before.
#
# Two-tier data strategy for this tracker:
#   - GDELT signals + optional ReliefWeb supplement: automated here.
#   - WHO/CDC outbreak data, governance, AI-Bio, synthesis screening: still
#     manual, via asking Claude to check — WHO's DON page has no documented
#     public API (it's JS-rendered from an internal endpoint), so it can't be
#     safely automated the same way without risking stale/wrong scraped data.

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours — adjust to taste
  workflow_dispatch: {}        # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run fetch script
        env:
          # Optional: only set this once you have an APPROVED ReliefWeb appname
          # (request one at https://apidoc.reliefweb.int/parameters, then add it
          # as a repo secret named RELIEFWEB_APPNAME under Settings > Secrets).
          # Until then, this step is skipped automatically — GDELT still runs.
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python3 fetch_data.py

      - name: Commit updated data.json (if changed)
        run: |
          git config user.name "containment-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: automated signal/data refresh [skip ci]"
          git push
